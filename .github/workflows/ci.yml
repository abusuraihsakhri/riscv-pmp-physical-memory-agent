name: Tests and security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package and optional API/test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,test]"
          python -m pip check
      - name: Verify Python package and tests
        run: |
          python -m compileall -q simulator.py cli.py agents riscv_pmp_agent
          python -m pytest -q
          python -c "from riscv_pmp_agent.server import create_app; assert create_app() is not None"
          python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"
      - name: Check browser scripts
        run: |
          node --check web/pmp.js
          node --check web/ui.js
          node --test tests/pmp_web.test.cjs
      - name: Build distributable wheel
        run: |
          python -m pip wheel --no-deps . -w /tmp/riscv-pmp-wheels
